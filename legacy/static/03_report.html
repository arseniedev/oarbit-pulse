<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Main -->

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- FONT FACE -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../styles/00_layout.css">
    <link rel="stylesheet" type="text/css" href="../styles/04_report.css">
</head>
<body>
    <header>
        <h1>Report</h1>
        <div>
            <!-- Bell icon -->
            <i class="fa fa-bell"></i>
            <!-- Profile picture -->
            <img id="user-profile" alt="user-profile" src="/img/profile.jpg">
        </div>
        
    </header>

    <main>
        <!-- AMD CHART  -->
      <h1>Habit Weekly<br>Summary</h1>
      <div id="habit-chart"></div>

    </main>

    <aside>
    </aside>

    <footer>
        <!-- <div class="menu"> -->
            <a href="01_habits.html"><i class="fa fa-calendar"></i></a>
            <a href="02_loop.html"><i class="fa fa-clock-o"></i></a>
            <a href="03_report.html"><i class="fa fa-pie-chart active-tab"></i></a>
            <a href="04_walkthrough.html"><i class="fa fa-question-circle"></i></a>
        <!-- </div> -->
    </footer>

    <!-- LISTING -->
    <script src="/src/habits.js" defer></script>
    <script src="/src/report.js" defer></script>

    <!-- AMD CHARTS -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <script>
        // var theReport

    function main() {
      let dataArray = []
      let theHabitManager = new TaskManager()
      if (localStorage.length === 0) {
        let placeholder = {}
        console.log(localStorage.length)
        placeholder['habit'] = "Empty"
        placeholder['duration'] = 100
        dataArray.push(placeholder)
        document.getElementById("habit-chart").classList.add("non-empty-chart")
      }
      else {
        let storedData = theHabitManager.getLocalStorage()
        for (let aHabit of storedData) {
          let habit = {}
          habit['habit'] = aHabit.taskName 
          habit['duration'] = aHabit.duration
          dataArray.push(habit)
        }
        // console.log(dataArray)
        // storedData.forEach(element => {
        // })
      }

      am5.ready(() => {
        new Chart("habit-chart", dataArray)
      })
    }
    window.onload = main
    </script>
</body>
</html>
