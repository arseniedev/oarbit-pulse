                <form class="form" id="task-form">
                    <h1>New Task</h1>
                    <div class="form-element">
                        <label for="task-name">Task Name</label>
                        <input type="text" id="task-name" name="task-name" placeholder="Enter task name" required>
                    </div>
                    <div class="form-element">
                        <label for="start-time">Start Time</label>
                        <input type="text" id="start-time" name="start-time" placeholder="00:00" required>
                    </div>
                    <div class="form-element">
                        <label for="end-time">End Time</label>
                        <input type="text" id="end-time" name="end-time" placeholder="00:00" required>
                    </div>
                    <button id="save" type="submit">Save</button>
                </form>
            </div>
    </aside>

    <script>
        window.onload = () => {
            window.localStorage.clear()
            taskManager.displayFormData();
        };

        const form = document.querySelector('#task-form')
        form.addEventListener('submit', (event) => {
            event.preventDefault()
            taskManager.handleFormData(form)
        })
