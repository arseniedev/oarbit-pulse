<body>
    <script defer src="/src/Form.js"></script>
    <script defer src="/src/Task.js"></script>

    <header>
        <h1>Oar-Bit Pulse</h1>
    </header>
    <main>
        <h1>Habits x0x</h1>           
        <div class="add-habit">
            <div>
            <!-- <button type="button" class="tablinks">Temp Save Button</button> -->
            <br>
            <button type="button" onclick="toggleForm()">Add task</button>
            </div>
            <div class="habit-container">
                <!-- <div class="time">
                    <p>00:00</p>
                    <br>
                    <p>00:00</p>
                </div> -->
                <div class="habit-details">
                    <!-- <p>&nbsp;</p -->
                        <table>
                            <div id="habit-output"></div><br>
                        </table>
                </div>
            </div>
        </div>
    </main>
    <nav>
        <!-- <div id="root"></div> -->
    </nav>
    <aside>
        <div id="form-ouput"></div>
        <div class="popup-form">
            <div class="close-button" type ="button" onclick="closeForm()">&times;</div>
            <form class="form">
                <h1>New Habit</h1>
                <div class="form-element">
                    <label for="task-name">Task Name</label><br>
                    <input type="text" id="task-name" name="task-name" placeholder="Enter task name" required>
                </div>
                <div class="form-element">
                    <label for="start-time">Start Time</label><br>
                    <input type="text" id="start-time" name="start-time" placeholder="00:00" required>
                </div>
                <div class="form-element">
                    <label for="end-time">End Time</label><br>
                    <input type="text" id="end-time" name="end-time" placeholder="00:00" required>
                </div>
                <div class="form-element">
                    <label for="end-time">End Time</label><br>
                    <input type="text" id="end-time" name="end-time" placeholder="00:00" required>
                </div>

                <button id="save" type="submit" onclick="getLocalStorage()">Save</button>
                <button id="discard" type="submit">Discard</button>
            </form>
        </div>
    </aside>
