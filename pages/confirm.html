<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../static/layout.css">
    <link rel="stylesheet" type="text/css" href="../static/task_style.css">
</head>
<body>
    <main>
        <div id="root"></div>
        <div id="add-task"></div>
        <button onclick="taskManager.toggleForm()">Add Task</button>
    </main>

    <aside>
        <!-- <script src="/src/Form.js" defer></script> -->
        <script src="/src/Task.js" defer></script>
            <div id="popup-form">
                <div class="close-button" onclick="taskManager.closeForm()">&times;</div>
                <form class="form" id="task-form">
                    <h1>New Task</h1>
                    <div class="form-element">
                        <label for="task-name">Task Name</label>
                        <input type="text" id="task-name" name="task-name" placeholder="Enter task name" required>
                    </div>
                    <div class="form-element">
                        <label for="start-time">Start Time</label>
                        <input type="text" id="start-time" name="start-time" placeholder="00:00" required>
                    </div>
                    <div class="form-element">
                        <label for="end-time">End Time</label>
                        <input type="text" id="end-time" name="end-time" placeholder="00:00" required>
                    </div>
                    <button id="save" type="submit">Save</button>
                </form>
            </div>
    </aside>

    <script></script>

    <script>
        let index = 0
        const form = document.querySelector('#task-form')
        form.addEventListener('submit', (event) => {
            taskManager.saveData(event, form, index)
        })
        window.onload = () => {
            taskManager.defaultTemplate();
        };
    </script>

    <script type="text/babel">
        function App() {
            const [rows, setRows] = React.useState([[]]);

            const handleAddRow = () => {
                setRows([...rows, []]);
            };
            return (
                <div>
                    <h1>OarBit</h1>
                    {rows}

                </div>
            );
        }
        const element = <App />;
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(element);
    </script>
</body>
</html>
