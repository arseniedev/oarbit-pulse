<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Main -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- FONT FACE -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="../static/00_layout.css">
    <link rel="stylesheet" type="text/css" href="../static/02_habits.css">

</head>
<body>
    <header>
        <h1>Habits</h1>
        <!-- <h1><a href="01_habits.html">Habits</a></h1> -->
        <div>
            <!-- Bell icon -->
            <i class="fa fa-bell"></i>
            <!-- Profile picture -->
            <img id="user-profile" alt="user-profile" src="/img/profile.jpg">
        </div>
        
    </header>
    <nav>
        <div class="head">
            <button id="previousBtn" class="previous">&#8249;</button>
            <div id="day"></div>
            <button id="nextBtn" class="next">&#8250;</button>
        </div>
    </nav>
    
    <main>
        <!-- <div id="root"></div> -->
        <div id="day-contents"></div>
        <div id="add-task"></div>
    </main>

    <footer>
        <!-- <div class="menu"> -->
            <a href="01_habits.html"><i class="fa fa-calendar active-tab"></i></a>
            <a href="02_loop.html"><i class="fa fa-clock-o"></i></a>
            <a href="03_report.html"><i class="fa fa-pie-chart"></i></a>
            <a href="04_walkthrough.html"><i class="fa fa-question-circle"></i></a>
        <!-- </div> -->
    </footer>

    <!-- LISTING -->
    <!-- <script src="/src/task_json.js" defer></script> -->
    <!-- <script src="/src/task_controller.js" defer></script> -->
    <script src="/src/task.js" defer></script>
    <script src="/src/habits.js" defer></script>

    <!-- CHART JS -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <script>
        var theTaskManager

        const previousBtn = document.getElementById('previousBtn')
        const nextBtn = document.getElementById('nextBtn')
        previousBtn.addEventListener('click', () => {
            theTaskManager.switchDayPage('back')
        })
        nextBtn.addEventListener('click', () => {
            theTaskManager.switchDayPage('forward')
        })

        function main() {
            theTaskManager = new TaskManager()
            document.getElementById('day').innerHTML = theTaskManager.switchDayDisplayed() 
            document.getElementById('day-contents').innerHTML = theTaskManager.displayFilteredTasks()
        }
        window.onload = main
    </script>

    <!-- TODO: INTEGRATE THIS FORM SPECIFIC CODE -->
    <script type="text/babel">
        function FormFetcher() {
        
        const submitHandler = (event) => {
            let form = document.querySelector('#task-form')
            event.preventDefault()
            theTaskManager.handleFormData(form)
        }

        const [seen, setSeen] = React.useState(false)

          if (seen) {
                return (
                    <aside>
                        <div id="popup-form">
                            <form class="form" id="task-form" onSubmit={submitHandler}>
                                <div class="form-head">
                                    <h1>New Task</h1>
                                    <button id="close-button" onClick={() => setSeen(false)}>&times;</button>
                                </div>
                                <div class="form-element">
                                    <label for="task-name">Task Name</label>
                                    <input type="text" id="task-name" name="task-name" placeholder="Enter task name" required/>
                                </div>
                                <div class="form-element">
                                    <label for="start-time">Start Time</label>
                                    <input type="text" id="start-time" name="start-time" placeholder="00:00" required/>
                                </div>
                                <div class="form-element">
                                    <label for="end-time">End Time</label>
                                    <input type="text" id="end-time" name="end-time" placeholder="00:00" required/>
                                </div>
                                <button id="save-button" type="submit">Save</button>
                            </form>
                        </div>
                    </aside>
                )
            } else {
                return <button onClick={() => setSeen(true)}><i class="fa fa-plus"></i></button>
            }
        }
        document.querySelectorAll("#add-task").forEach((domContainer) => {
        let root = ReactDOM.createRoot(domContainer)
        
        const element = <FormFetcher/>
        root.render(element)
    })
    </script>
  

</body>
</html>
