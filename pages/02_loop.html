<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>

    <!-- Main -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- FONT FACE -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="../static/00_layout.css">
    <link rel="stylesheet" type="text/css" href="../static/03_loop.css">
</head>
<body>
    <header>
        <h1>Loop</h1>
        <div>
            <!-- Bell icon -->
            <i class="fa fa-bell"></i>
            <!-- Profile picture -->
            <img id="user-profile" alt="user-profile" src="/img/profile.jpg">
        </div>
        
    </header>
    <main>
        <div class="duration">
            <h1>11hrs</h1>
            <h6>Duration</h6>
        </div>
        <div class="loop-container">
            <div class="start-time-container">
                <h4>Start Time</h4>
                <input type="text" id="start-time" name="start-time" placeholder="00:00" required>
            </div>
            <div class="end-time-container">
                <h4>End Time</h4>
                <input type="text" id="end-time" name="end-time" placeholder="00:00" required>
            </div>
        </div>
        <div class="interval">
            <label for="task-name"><h4>Interval</h4></label>
            <input type="text" id="task-name" name="task-name" placeholder="Enter minute interval" required>
        </div>
        <button>Begin</button>

    </main>
    <aside>
        
    </aside>
        


    <footer>
        <!-- <div class="menu"> -->
            <a href="01_habits.html"><i class="fa fa-calendar"></i></a>
            <a href="02_loop.html"><i class="fa fa-clock-o active-tab"></i></a>
            <a href="03_report.html"><i class="fa fa-pie-chart"></i></a>
            <a href="04_walkthrough.html"><i class="fa fa-question-circle"></i></a>
        <!-- </div> -->
    </footer>

</body>
</html>
